<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vibeforge | Swiss</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    
    <!-- HEADER -->
    <header class="app-header">
        <div class="brand">VIBEFORGE <span class="tag">CFO</span></div>
        <div class="actions">
            <span class="status" id="sys-status">SYS.ONLINE</span>
            <button id="btn-reset">RESET</button>
        </div>
    </header>

    <!-- BACK BUTTON (Hidden by default) -->
    <button id="btn-back" class="btn-back">← BACK TO GRID</button>

    <!-- MAIN GRID (Home View) -->
    <main id="home-view" class="swiss-grid">
        
        <!-- BLOCK: BUDGET -->
        <div class="grid-block" data-target="view-budget" id="block-budget">
            <div class="block-number">01</div>
            <div class="block-title">BUDGET &<br>NET WORTH</div>
            <div class="block-preview" id="preview-net-worth">₹0</div>
        </div>

        <!-- BLOCK: INVESTMENTS -->
        <div class="grid-block" data-target="view-investments" id="block-investments">
            <div class="block-number">02</div>
            <div class="block-title">PORTFOLIO<br>INVESTMENTS</div>
            <div class="block-preview" id="preview-investments">₹0</div>
        </div>

        <!-- BLOCK: BILLS -->
        <div class="grid-block" data-target="view-bills" id="block-bills">
            <div class="block-number">03</div>
            <div class="block-title">UPCOMING<br>BILLS</div>
            <div class="block-preview" id="preview-bills">₹0</div>
        </div>

        <!-- BLOCK: AI ORCHESTRATOR -->
        <div class="grid-block block-dark" data-target="view-chat" id="block-chat">
            <div class="block-number">04</div>
            <div class="block-title">AI ORCHESTRATOR<br>QUERY SYSTEM</div>
            <div class="block-preview">>_ STANDBY</div>
        </div>

    </main>

    <!-- DETAIL VIEWS (Hidden by default) -->
    <div id="detail-container" class="detail-container">
        
        <!-- DETAIL: BUDGET -->
        <div class="detail-view" id="view-budget">
            <div class="detail-header">
                <h1>NET WORTH</h1>
                <button class="btn" onclick="openModal('profile')">EDIT PROFILE</button>
            </div>
            <div class="massive-number" id="detail-net-worth">₹0</div>
            
            <div class="data-grid">
                <div class="data-cell">
                    <label>MONTHLY INCOME</label>
                    <div class="val" id="detail-income">₹0</div>
                </div>
                <div class="data-cell">
                    <label>EXPENSES</label>
                    <div class="val" id="detail-expenses">₹0</div>
                </div>
                <div class="data-cell">
                    <label>DISPOSABLE</label>
                    <div class="val" id="detail-disposable">₹0</div>
                </div>
                <div class="data-cell bg-accent">
                    <label>SAVINGS RATE</label>
                    <div class="val" id="detail-savings-rate">0%</div>
                </div>
            </div>

            <div class="detail-header mt-large">
                <h1>TRANSACTION LEDGER</h1>
                <button class="btn" onclick="openModal('transaction')">+ NEW TXN</button>
            </div>
            <div class="list-wrapper">
                <table class="swiss-table" id="table-transactions">
                    <!-- Populated by JS -->
                </table>
            </div>
        </div>

        <!-- DETAIL: INVESTMENTS -->
        <div class="detail-view" id="view-investments">
            <div class="detail-header">
                <h1>INVESTMENTS</h1>
                <button class="btn" onclick="openModal('investment')">+ ADD ASSET</button>
            </div>
            <div class="list-wrapper mt-large">
                <table class="swiss-table" id="table-investments">
                    <!-- Populated by JS -->
                </table>
            </div>
            <div class="total-row mt-large">
                <label>TOTAL ASSETS</label>
                <div class="val" id="detail-total-invested">₹0</div>
            </div>
        </div>

        <!-- DETAIL: BILLS -->
        <div class="detail-view" id="view-bills">
            <div class="detail-header">
                <h1>UPCOMING BILLS</h1>
                <button class="btn" onclick="openModal('bill')">+ ADD BILL</button>
            </div>
            <div class="list-wrapper mt-large">
                <table class="swiss-table" id="table-bills">
                    <!-- Populated by JS -->
                </table>
            </div>
            <div class="total-row mt-large">
                <label>TOTAL UPCOMING</label>
                <div class="val" id="detail-total-bills">₹0</div>
            </div>
        </div>

        <!-- DETAIL: CHAT -->
        <div class="detail-view chat-ethereal" id="view-chat">
            
            <!-- Three.js Canvas Container -->
            <div id="canvas-container"></div>
            
            <!-- Ethereal Greeting & Chat UI -->
            <div class="chat-overlay">
                <div class="greeting-text">
                    <div class="sub">Hello, Robin</div>
                    <div class="main">How can I help<br>you today?</div>
                </div>

                <div id="chat-display" class="chat-display">
                    <!-- Chat bubbles injected here -->
                </div>
                
                <div id="trace-panel" class="trace-panel hidden">
                    <div id="trace-logs" class="trace-logs"></div>
                </div>

                <form id="form-chat" class="glass-pill-form">
                    <input type="text" id="chat-input" placeholder="Ask anything..." autocomplete="off" required>
                    <button type="submit" id="btn-send">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 4v16m-4-4l4 4 4-4" />
                        </svg>
                    </button>
                </form>
            </div>
        </div>

    </div>

    <!-- MODAL OVERLAY -->
    <div id="modal-backdrop" class="modal-backdrop hidden"></div>
    <div id="modal-container" class="modal-container hidden">
        <div class="modal-header">
            <h2 id="modal-title">EDIT</h2>
            <button class="btn-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body">
            <form id="modal-form" class="swiss-form">
                <!-- Injected via JS -->
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
